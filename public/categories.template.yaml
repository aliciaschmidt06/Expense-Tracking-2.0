# Example categories yaml file you can download and fill out.
# Once finished customizing for yourself, save and upload. 
categories:
  unknown:
    target_percentage:
      equal_to: 0
  guilt-free-spending:
    keywords:
      - restaurant
      - cafe
    target_percentage:
      less_than: 30.0
  fixed:
    keywords:
      - provident
      - sofia
    target_percentage:
      less_than: 50.0
  investments:
    keywords:
      - retirement
      - stocks
    target_percentage:
      greater_than: 10.0
  vacation:
    keywords:
      - expedia
    target_percentage:
      less_than: 10.0
  income:
    keywords:
      - payroll
    target_percentage:
      not_applicable: true
  ignore:
    keywords:
      - THANK YOU
      - pre-authorized
      - preauthorized
      - service charge
      - annual fee
      - Internet Banking INTERNET TRANSFER
    target_percentage:
      equal_to: 0
