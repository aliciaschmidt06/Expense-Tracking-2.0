# Expense Tracking Configuration Template
# Upload this file to configure your income and spending categories
# Don't include percentages - they'll be auto-calculated and you can adjust via the pie chart

income:
  keywords:
    - payroll
    - salary
    - interest

spending_categories:
  dining:
    keywords:
      - restaurant
      - cafe
      - diner
  fixed:
    - rent
    - utilities
    - insurance
  guilt_free:
    - amazon
    - entertainment
    - shopping
  investments:
    - retirement
    - stocks
  vacation:
    - hotel
    - airbnb
    - travel

